[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require Databricks/SQL Server)
    slow: Slow tests
    api: API connector tests
    sql: SQL Server connector tests
    ingestor: Ingestor tests

# Output options (PyCharm compatible - no coverage in addopts)
addopts =
    -v
    --tb=short
    --strict-markers

# Coverage: Run from command line with: pytest --cov=src --cov-report=html
# Or use: make test-cov

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
