resources:
  jobs:
    kafka_daily_ingestion:
      name: "[${bundle.target}] Kafka Previous-Day Ingestion"

      tags:
        engine: "kafka-ingestion"
        source_type: "kafka"
        environment: "${bundle.target}"

      job_clusters:
        - job_cluster_key: "kafka_ingestion_cluster"
          new_cluster:
            spark_version: "${var.spark_version}"
            node_type_id: "${var.node_type_id}"
            num_workers: ${var.num_workers}
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      tasks:
        - task_key: "ingest_kafka_domains"
          for_each_task:
            inputs: ${var.kafka_domains}
            concurrency: 2
            task:
              task_key: "ingest_kafka_domain"
              job_cluster_key: "kafka_ingestion_cluster"
              notebook_task:
                notebook_path: "${workspace.file_path}/notebooks/main_kafka_ingestion"
                base_parameters:
                  domain_name: "{{input.name}}"
                  catalog_name: "${var.catalog_name}"
                  bronze_schema: "${var.bronze_schema}"
                  run_date: ""
              libraries:
                - pypi:
                    package: "pyyaml"
                - maven:
                    coordinates: "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0"
              timeout_seconds: 7200
              max_retries: 2
              retry_on_timeout: true

      schedule:
        quartz_cron_expression: "0 30 2 * * ?"
        timezone_id: "Europe/Paris"
        pause_status: "PAUSED"

      email_notifications:
        on_failure:
          - "data-engineering@yourcompany.com"

      max_concurrent_runs: 1
      timeout_seconds: 28800
