# CI — runs on every pull request targeting master.
# 1. Unit tests (PySpark local mode).
# 2. Databricks Asset Bundle validation against the `dev` target.
#
# Auth: OAuth Machine-to-Machine (M2M) service principal.
# The `dev` GitHub Environment must provide these secrets:
#   - DATABRICKS_CLIENT_ID
#   - DATABRICKS_CLIENT_SECRET
# The workspace host is read from the `dev` target in databricks.yml.
name: CI

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up JDK (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests
        run: pytest -m "not integration" --tb=short

  validate-bundle:
    name: Validate bundle (dev)
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t dev
