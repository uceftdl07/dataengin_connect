domain: wolf
description: "Domaine WOLF - APIs analytiques"

apis:
  - api_name: "analytics_api"
    target_table: "api_analytics_events"
    enabled: true
    description: "API des événements analytics"
    
    base_url: "https://analytics.wolf-platform.io"
    endpoint: "/v1/events"
    http_method: "GET"
    
    auth_type: "bearer"
    
    pagination:
      type: "page"
      page_size: 250
      page_size_param: "page_size"
      page_param: "page"
      max_pages: 1000
    
    query_params:
      event_type: "conversion,engagement"
      include_properties: "true"
    
    headers:
      Accept: "application/json"
    
    rate_limit:
      requests_per_second: 25
      burst: 50
    
    retry_config:
      max_retries: 3
      retry_delay_seconds: 5
      backoff_factor: 2
      retry_on_status:
        - 429
        - 500
        - 503
    
    timeout_seconds: 30
    
    response_path: "events"
    total_count_path: "pagination.total_count"
    
    load_mode: "incremental"
    incremental_field: "event_timestamp"
    incremental_type: "timestamp"
    
    write_mode: "unity_catalog"
    adls_path: "api/analytics_api/incremental"
    
    partition_by:
      - "event_date"
    
    derived_columns:
      event_date: "to_date(event_timestamp)"
  
  - api_name: "reporting_api"
    target_table: "api_reports"
    enabled: true
    description: "API des rapports générés"
    
    base_url: "https://reports.wolf-platform.io"
    endpoint: "/api/reports"
    http_method: "GET"
    
    auth_type: "api_key"
    auth_config:
      api_key_header: "X-Report-API-Key"
    
    pagination:
      type: "offset"
      page_size: 50
      page_size_param: "limit"
      offset_param: "offset"
      max_pages: 200
    
    query_params:
      format: "json"
      status: "completed"
    
    headers:
      Accept: "application/json"
    
    rate_limit:
      requests_per_second: 10
      burst: 20
    
    retry_config:
      max_retries: 4
      retry_delay_seconds: 10
      backoff_factor: 2
      retry_on_status:
        - 429
        - 500
        - 502
        - 503
    
    timeout_seconds: 60
    
    response_path: "reports"
    
    load_mode: "full"
    
    write_mode: "unity_catalog"
    adls_path: "api/reporting_api/full"

global_options:
  add_metadata_columns: true
  metadata_columns:
    - name: "_ingestion_timestamp"
      type: "timestamp"
      expression: "current_timestamp()"
    - name: "_source_domain"
      type: "string"
      expression: "'wolf'"
  
  error_handling:
    max_retries: 3
    on_error: "fail"
  
  delta_options:
    optimizeWrite: true
    autoCompact: true
