domain: mv
description: "Connecteur SQL Server pour le domaine MV"

connector:
  type: "sqlserver"
  
  secret_scope: "sqlserver-mv"
  
  secret_keys:
    hostname: "hostname"
    port: "port"
    database: "database"
    username: "username"
    password: "password"
  
  jdbc_options:
    driver: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    encrypt: "true"
    trustServerCertificate: "false"
    loginTimeout: "30"
    fetchsize: "10000"
    batchsize: "10000"
    isolationLevel: "READ_UNCOMMITTED"
    applicationName: "Databricks-Ingestion-MV"
  
  connection_pool:
    enabled: true
    max_pool_size: 10
    min_pool_size: 2
    connection_timeout_seconds: 30

